name: Release App

on:
  pull_request:
    branches:
      ["main"]
  push:
    branches:
      ["main"]
    tags:
      - 'v*' # Triggers on release tags like v0.1.0 or v1.0.0

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # jsdom 30 pulls in undici 8, which needs Node >= 22.19 (it uses
      # zlib.createZstdDecompress, absent on Node 20).
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install node modules
        run: npm ci

      # `tauri::generate_context!` validates `frontendDist: "../dist"`, so the
      # frontend bundle has to exist before the Rust tests are compiled.
      - name: Build frontend bundle
        run: npm run build

      - name: Run frontend tests (Vitest)
        run: npm test

      - name: Run Rust tests (unit + SQLite integration)
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  release:
    if: github.event_name == 'push'
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Install Linux build dependencies
      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install node modules
        run: npm ci

      - name: Build and Package App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AutoShorts ${{ github.ref_name }}'
          releaseBody: 'See release notes for installation details.'
          releaseDraft: true
          prerelease: false

  android:
    needs: test
    if: 
      github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install node modules
        run: npm ci

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Build Android bundles
        run: npx tauri android build --apk --aab

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/android
          find src-tauri/gen/android/app/build/outputs -type f \
            \( -name '*.apk' -o -name '*.aab' \) -exec cp {} artifacts/android/ \;
          ls -lh artifacts/android

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-bundles
          path: artifacts/android/*

  ios:
    needs: test
    if: 
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install node modules
        run: npm ci

      - name: Init iOS project
        run: npx tauri ios init --ci

      - name: Build iOS app (unsigned)
        run: npx tauri ios build --no-sign

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/ios
          find src-tauri/gen/apple/build -maxdepth 4 -name '*.app' -type d -exec cp -R {} artifacts/ios/ \;
          find src-tauri/gen/apple/build -maxdepth 4 -name '*.ipa' -type f -exec cp {} artifacts/ios/ \;
          ls -lhR artifacts/ios || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: artifacts/ios/**

  windows:
    needs: test
    if: 
      github.event_name == 'push'
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install node modules
        run: npm ci

      - name: Build and Package App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AutoShorts ${{ github.ref_name }}'
          releaseBody: 'See release notes for installation details.'
          releaseDraft: true
          prerelease: false
  linux:
    needs: test
    if: 
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install node modules
        run: npm ci

      - name: Build and Package App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AutoShorts ${{ github.ref_name }}'
          releaseBody: 'See release notes for installation details.'
          releaseDraft: true
          prerelease: false
